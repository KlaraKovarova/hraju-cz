# DISABLED — Hostinger CI auto-deploys from GitHub on every push.
# Manually rsyncing a Next.js standalone bundle over Hostinger's own build
# causes 503s because the two directory structures are incompatible.
#
# Deployment flow:
#   Code change → git push → Hostinger CI builds → auto-deploys to nodejs/
#
# Environment variables (DATABASE_URL etc.) are managed in:
#   hPanel → Websites → hraju.cz → Node.js → Environment Variables
#
# If you need to force a redeploy, push any commit to main.

name: Daily Production Deploy (disabled)

on:
  workflow_dispatch: # Keep manual trigger for emergencies only

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "This workflow is disabled."
          echo "Hostinger CI handles all deployments automatically on git push."
          echo "Manage env vars in hPanel → Node.js → Environment Variables."
