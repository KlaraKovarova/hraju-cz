name: Daily Production Deploy

on:
  schedule:
    # Run every day at 6:00 AM UTC (7:00 or 8:00 CET/CEST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Generate static snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SNAPSHOT_BASE_URL: http://localhost:3000
        run: |
          # Start Next.js standalone server in background
          DATABASE_URL="${DATABASE_URL}" DIRECT_URL="${DIRECT_URL}" node .next/standalone/server.js &
          SERVER_PID=$!

          # Wait for server to be ready (up to 60s)
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/robots.txt; then
              echo "Server ready after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server exited unexpectedly"
              exit 1
            fi
            sleep 1
          done

          # Run static snapshot crawler (skip direct DB facility query — Next.js handles DB)
          SNAPSHOT_SKIP_FACILITIES=1 npx tsx scripts/build-static-snapshot.ts

          # Stop server
          kill "$SERVER_PID" 2>/dev/null || true

      - name: Deploy static snapshot to Hostinger
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH_OPTS="-i /tmp/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no"

          # rsync: delta sync — only changed files are transferred (fast for daily deploys)
          # Exclude adminer.php from deletion so it persists across deploys
          rsync -az --delete \
            --exclude='adminer*.php' \
            -e "ssh $SSH_OPTS" \
            out-static/ \
            "$SSH_USER@$SSH_HOST:/hraju.cz/"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'echo "Deploy complete at $(date -u)"'
          rm /tmp/deploy_key
